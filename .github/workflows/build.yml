name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The job token can only read the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs; the comment says which release.
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities in Cargo.lock; unmaintained crates are only reported.
      - run: cargo audit

  build:
    needs: audit
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: supervisor
          - os: windows-latest
            artifact: supervisor.exe
          - os: macos-latest
            artifact: supervisor
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supervisor-${{ runner.os }}
          path: target/release/${{ matrix.artifact }}

  # One SHA256SUMS.txt for all three binaries, to attach to the release.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - run: sha256sum supervisor-*/* | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
